name: Ejercicio 5 - Workflow Completo con Variables y Secrets

on:
  push:
    branches: [ main ]

env:
  APP_NAME: "Quiz App"
  VERSION: "1.0.0"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.create-timestamp.outputs.timestamp }}
    
    steps:
      - name: Mostrar información de la app
        run: |
          echo "Aplicación: ${{ env.APP_NAME }}"
          echo "Versión: ${{ env.VERSION }}"
      
      - name: Crear timestamp
        id: create-timestamp
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

  test:
    needs: setup
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
      
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Ejecutar tests
        run: npm test
      
      - name: Mostrar timestamp del job setup
        run: echo "Timestamp del setup:${{ needs.setup.outputs.timestamp }}"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      API_KEY: ${{ secrets.API_KEY }}
    
    steps:
      - name: Mensaje de despliegue
        run: echo "Desplegando${{ env.APP_NAME }} v${{ env.VERSION }}"
      
      - name: Verificar secret
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret configurada correctamente"
          else
            echo "Error: Secret no configurada"
            exit 1
          fi